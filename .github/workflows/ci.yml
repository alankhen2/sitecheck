name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts requires DATABASE_URL even for `prisma generate`.
      # Nothing connects to it; integration tests use TEST_DATABASE_URL below.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    # Same image as docker-compose.yml, so CI tests the Postgres version we develop on.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sitecheck
          POSTGRES_PASSWORD: sitecheck
          POSTGRES_DB: sitecheck_test
        ports:
          - 5432:5432
        # Steps start only once Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U sitecheck -d sitecheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Actions are pinned to a full commit SHA (tag in the comment), so a
      # moved or compromised tag cannot change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://sitecheck:sitecheck@localhost:5432/sitecheck_test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    # A browser run is the slowest check, and pointless if the code does not even build.
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts requires DATABASE_URL even for `prisma generate`.
      # Nothing connects to it; the tests start their API on sitecheck_e2e.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    # The same user and password as docker-compose.yml, which the tests' default address expects.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sitecheck
          POSTGRES_PASSWORD: sitecheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitecheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm --filter @sitecheck/e2e exec playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # What happened on a failure: open the report for screenshots and a step-by-step trace.
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
